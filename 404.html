<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Hamburgueria — Blumenau, SC (conceito)</title>
    <script>
      // GitHub Pages SPA fallback: preserve the route and hand it to the app.
      (function () {
        var base = "/a-hamburgueria-sample/";
        var path = window.location.pathname;
        var route = path.indexOf(base) === 0 ? path.slice(base.length) : "";
        var target = base + (route || "");
        window.location.replace(target + window.location.search + window.location.hash);
      })();
    </script>
    <style>
      body {
        margin: 0;
        background: #0c0b0a;
        color: #f6f1e7;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        text-align: center;
      }
      a {
        color: #ff5a1f;
      }
    </style>
  </head>
  <body>
    <p>
      Redirecionando… <a href="/a-hamburgueria-sample/">Voltar ao início</a>
    </p>
  </body>
</html>
